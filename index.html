<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silicon Atlas · Semiconductor device labs</title>
    <meta
      name="description"
      content="Ten interactive labs for introductory solid-state and electronic/photonic devices courses: materials, carriers, fabrication, junctions, transistors, photonics and measurement."
    />
    <meta name="theme-color" content="#0b1118" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint. Dark is the default.
      try {
        if (localStorage.getItem('atlas.theme') === 'light')
          document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
